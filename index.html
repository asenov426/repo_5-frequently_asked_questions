<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>FAQ</title>
  </head>
  <body>
    <h1>Frequently Asked Questions</h1>
    <main>

      <section>
        <article>
          <h3>Why shouldn't we trust atoms?</h3>
          <p class="nonvisible">They make up everything.</p>
        </article>
        <button>
          <ion-icon name="chevron-down-outline"></ion-icon>
          <ion-icon name="chevron-up-outline" class="nonvisible"></ion-icon>
        </button>
      </section>

      <section>
        <article>
          <h3>What do you call someone with no body and no nose?</h3>
          <p class="nonvisible">Nobody knows.</p>
        </article>
        <button>
          <ion-icon name="chevron-down-outline"></ion-icon>
          <ion-icon name="chevron-up-outline" class="nonvisible"></ion-icon>
        </button>
      </section>

      <section>
        <article>
          <h3>What's the object-oriented way to become wealthy?</h3>
          <p class="nonvisible">Inheritance.</p>
        </article>
        <button>
          <ion-icon name="chevron-down-outline"></ion-icon>
          <ion-icon name="chevron-up-outline" class="nonvisible"></ion-icon>
        </button>
      </section>

      <section>
        <article>
          <h3>How many tickles does it take to tickle an octopus?</h3>
          <p class="nonvisible">Ten-tickles.</p>
        </article>
        <button>
          <ion-icon name="chevron-down-outline"></ion-icon>
          <ion-icon name="chevron-up-outline" class="nonvisible"></ion-icon>
        </button>
      </section>

    </main>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  </body>
</html>
